services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./upstreams.json:/data/upstreams.json:ro
      - gateway-data:/data
    ports:
      - "127.0.0.1:8800:8800"     # 只对本机开放，外面由 Caddy 反代

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host          # 直接占用主机的 80/443，反代到 127.0.0.1:8800
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  gateway-data:
  caddy-data:
